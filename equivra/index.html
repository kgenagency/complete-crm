<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2219">
<meta name="robots" content="noindex, nofollow">
<title>EQUIVRA · CRM</title>
<link rel="icon" href="favicon-64.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EQUIVRA CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#EFEBE1; --surface:#FAF8F2; --surface-2:#F4F1E8; --ink:#1B2620; --ink-2:#47544A; --muted:#7E8C74; --line:#DCD6C6;
  --green:#0F2219; --green-2:#16302A; --wash:#E2E6DC; --sage:#7E8C74; --gold:#C8AB7A; --gold-ink:#8A6D3B; --gold-wash:#F1E8D6;
  --ochre:#9A7B36; --ochre-wash:#F0E7D3; --clay:#8C6157; --clay-wash:#EFE0DB; --blue:#4F6B7A; --blue-wash:#E0E7EA;
  --radius:14px; --radius-sm:9px; --shadow:0 1px 2px rgba(27,38,32,.05),0 8px 24px rgba(27,38,32,.06);
  --display:'Cormorant Garamond',Georgia,serif; --ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:inherit}
.hidden{display:none !important}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--green)}
.login-card{width:min(380px,100%);background:var(--surface);border-radius:18px;padding:30px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card .mono{width:64px;height:64px;margin:0 auto 10px;display:block;object-fit:contain;background:var(--green);border-radius:16px;padding:8px}
.login-card h1{font-family:var(--display);font-weight:600;text-align:center;letter-spacing:.24em;margin:0;font-size:26px}
.login-card p{text-align:center;color:var(--muted);margin:2px 0 22px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.err{color:var(--clay);font-size:13px;min-height:18px;margin-top:8px}

/* topbar */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--green);color:#F4EFE6}
.topbar .mono{width:32px;height:32px;flex:none;object-fit:contain}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.24em}
.brand span{font-size:10.5px;color:var(--gold);letter-spacing:.18em;text-transform:uppercase}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;min-width:240px;position:relative}
.search input{border:0;background:transparent;color:#F4EFE6;outline:none;width:100%;font-size:14px}
.search input::placeholder{color:rgba(244,239,230,.55)}
.sresults{position:absolute;top:calc(100% + 6px);right:0;width:min(420px,92vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:70}
.sresults div{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.sresults div:hover{background:var(--surface-2)}
.sresults small{display:block;color:var(--muted);font-size:12px}
.chip-user{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid rgba(255,255,255,.18);border-radius:999px;font-size:13px;font-weight:500;background:transparent;color:#F4EFE6}
.chip-user i{width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--green);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}

/* nav */
.nav{display:flex;gap:4px;padding:8px 18px;background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:50px;z-index:30}
.nav button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.nav button[aria-current="page"]{background:var(--green);color:#F4EFE6}
.nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--gold);color:var(--green);font-size:11px;font-weight:700;line-height:18px;text-align:center}

/* shell */
.wrap{max-width:1200px;margin:0 auto;padding:22px 18px 90px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-family:var(--display);font-weight:500;font-size:34px;margin:0;line-height:1.1}
.page-head p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.btn{border:1px solid var(--green);background:var(--green);color:#F4EFE6;padding:9px 18px;border-radius:999px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--green)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{background:transparent;border-color:var(--clay);color:var(--clay)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12px;color:var(--muted);letter-spacing:.03em}
.stat .val{font-family:var(--display);font-size:32px;font-weight:600;line-height:1.1;margin-top:4px}
.stat .sub{font-size:12px;color:var(--ink-2);margin-top:2px}

.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-family:var(--display);font-size:22px;font-weight:600}
.panel-b{padding:6px 16px 14px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:14px}

.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto;max-width:100%}
.seg button{border:0;background:transparent;color:var(--ink-2);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--green);color:#F4EFE6}
select.filter,input.filter{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px}
.count{margin-left:auto;font-size:13px;color:var(--muted)}

table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.05em;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase}
tbody tr{border-bottom:1px solid var(--line);cursor:pointer}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tbody td{padding:12px 14px;vertical-align:middle;font-size:14px}
td.name{position:relative;padding-left:20px}
td.name::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--sage)}
tr[data-c="vruc"] td.name::before,tr[data-c="prodat"] td.name::before{background:var(--gold)}
tr[data-c="hladan"] td.name::before,tr[data-c="povucen"] td.name::before,tr[data-c="nije_prodat"] td.name::before{background:var(--line)}
tr[data-c="na_aukciji"] td.name::before{background:var(--ochre)}
.pname{font-family:var(--display);font-size:18px;font-weight:600;line-height:1.2}
.psub{font-size:12px;color:var(--muted);margin-top:1px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.p-green{background:var(--wash);color:var(--ink)}
.p-gold{background:var(--gold-wash);color:var(--gold-ink)}
.p-ochre{background:var(--ochre-wash);color:var(--ochre)}
.p-clay{background:var(--clay-wash);color:var(--clay)}
.p-blue{background:var(--blue-wash);color:var(--blue)}
.ch{display:inline-flex;gap:4px}
.ch span{font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.ch span.on{background:var(--green);color:var(--gold);border-color:var(--green)}

/* kanban */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:9px;min-height:140px}
.col.over{outline:2px solid var(--gold);outline-offset:-2px}
.col h3{margin:2px 4px 9px;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;display:flex;justify-content:space-between;text-transform:uppercase}
.col h3 em{font-style:normal;color:var(--muted);font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--sage);border-radius:var(--radius-sm);padding:10px 11px;margin-bottom:8px;cursor:grab;touch-action:pan-y}
.card.late{border-left-color:var(--ochre)}
.card.dragging{opacity:.45}
.card .who{font-weight:600;font-size:13.5px}
.card .what{font-size:12px;color:var(--muted);margin-top:2px}
.card .amt{font-family:var(--display);font-size:17px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11.5px;color:var(--muted)}
.card select{font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:3px 6px;max-width:100%}
.hint{font-size:12.5px;color:var(--muted);margin:10px 2px 0}

/* lists */
.li{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .dot{width:8px;height:8px;border-radius:50%;background:var(--sage);margin-top:7px;flex:none}
.li .dot.late{background:var(--ochre)}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;font-size:14px}
.li .s{font-size:12.5px;color:var(--muted)}
.li .acts{display:flex;gap:6px;flex:none}
.ic{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;font-size:13px;font-weight:700;text-decoration:none;flex:none}
.ic.wa{color:#1f7a4d}.ic.vb{color:#665CAC}
.check{width:22px;height:22px;flex:none;accent-color:var(--green);margin-top:2px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(15,34,25,.38);opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .22s ease;z-index:60;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dr-head{padding:18px 20px 14px;border-bottom:1px solid var(--line);position:relative}
.dr-head .pname{font-size:26px;display:block;padding-right:40px}
.x{position:absolute;top:14px;right:14px;border:1px solid var(--line);background:var(--surface-2);width:32px;height:32px;border-radius:50%}
.dr-body{padding:14px 20px 30px;overflow:auto;flex:1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--ink-2)}
.kv b{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.sec{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;margin:20px 0 8px;text-transform:uppercase}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 14px 18px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}
.tl li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--sage)}
.tl li.k-sajt::before{background:var(--gold)}
.tl li.k-faza::before{background:var(--blue)}
.tl li::after{content:"";position:absolute;left:3px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl time{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.98);width:min(560px,94vw);max-height:90vh;overflow:auto;background:var(--surface);border-radius:16px;z-index:65;opacity:0;pointer-events:none;transition:.16s;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.modal.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal .m-h{padding:18px 20px 10px;font-family:var(--display);font-size:26px;font-weight:600;position:relative}
.modal .m-b{padding:4px 20px 20px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;flex:1;min-width:140px}
.field label{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;background:var(--surface-2);cursor:pointer}
.chips input{accent-color:var(--green)}
.consent{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.consent input{width:20px;height:20px;accent-color:var(--green);flex:none}
.consent small{display:block;color:var(--muted);font-size:12px}
.note-box{background:var(--gold-wash);border:1px solid #E6D6B5;color:var(--gold-ink);border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--green);color:#F4EFE6;padding:11px 18px;border-radius:999px;font-size:14px;z-index:90;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.msg-body{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:6px 0}
.cal-day{margin-bottom:14px}
.cal-day h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cal-day h4.today{color:var(--gold-ink)}
.mono-svg{display:block;width:100%;height:100%}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .search{min-width:0;flex:1}
  .brand span{display:none}
  .chip-user span{display:none}
  .page-head h1{font-size:28px}
  .board{grid-auto-columns:80vw}
  table.resp thead{display:none}
  table.resp tbody tr{display:block;padding:10px 12px 10px 18px;position:relative}
  table.resp tbody td{display:block;padding:2px 0;border:0}
  table.resp tbody td.name{padding-left:0;position:static}
  table.resp tbody td.name::before{left:0;top:10px;bottom:10px}
  table.resp tbody td.hide-m{display:none}
}

/* ================= animacije, zvonce, zadaci (kao Harizma) ================= */
:root{--ease:cubic-bezier(.2,.8,.2,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
.view-in{animation:fadeUp .45s var(--ease)}
.view-in .stat,.view-in .panel,.view-in .col,.view-in .card{animation:fadeUp .5s var(--ease) both}
.view-in .stat:nth-child(2),.view-in .panel:nth-child(2){animation-delay:.05s}
.view-in .stat:nth-child(3),.view-in .panel:nth-child(3){animation-delay:.1s}
.view-in .stat:nth-child(4),.view-in .panel:nth-child(4){animation-delay:.15s}
.view-in .panel:nth-child(5){animation-delay:.2s}.view-in .panel:nth-child(6){animation-delay:.25s}
.stat,.panel{transition:transform .25s var(--ease),box-shadow .25s}
.stat:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(27,38,32,.05),0 16px 34px rgba(27,38,32,.1)}
.btn{transition:transform .15s var(--ease),box-shadow .2s,filter .2s,background .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 22px -10px rgba(15,34,25,.55)}
.btn:active:not(:disabled){transform:scale(.97)}
.nav button{transition:background .2s,color .2s}
.nav .badge{animation:pop .4s var(--ease)}
.nav .badge.hidden{display:none}
.modal.open{animation:modalIn .35s var(--ease)}
@keyframes modalIn{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}}
.toast.show{animation:toastIn .35s cubic-bezier(.2,1.3,.4,1)}
@keyframes toastIn{from{transform:translate(-50%,16px) scale(.95)}}
/* učitavanje */
.sk{position:relative;overflow:hidden;min-height:92px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-2) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.sk.tall{min-height:320px}
.sk-head{margin:6px 0 22px}.sk-head i{display:block;height:28px;width:200px;border-radius:8px;background:var(--line);opacity:.6;margin-bottom:8px;animation:pulseO 1.2s ease-in-out infinite}.sk-head i+i{height:12px;width:320px}
@keyframes pulseO{50%{opacity:.25}}

/* uvod */
.splash{position:fixed;inset:0;z-index:300;background:radial-gradient(900px 600px at 50% 40%,#1d3a2d,#0F2219 60%,#08140e);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#EFEBE1;transition:opacity .6s var(--ease),visibility .6s}
.splash.hide{opacity:0;visibility:hidden}
.sp-stage{position:relative;width:140px;height:140px}
.sp-stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.splash .d{fill:none;stroke:#C8AB7A;stroke-width:1.2;stroke-dasharray:340;stroke-dashoffset:340;animation:draw 1.1s var(--ease) forwards}
.splash .d2{stroke:rgba(239,235,225,.45);animation-delay:.18s}
.splash .br{fill:none;stroke:#7E8C74;stroke-width:1.2;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .55s var(--ease) forwards;opacity:0}
.sp-logo{position:absolute;left:50%;top:50%;width:74px;height:74px;object-fit:contain;transform:translate(-50%,-50%) scale(.7);opacity:0;animation:logoIn .8s .6s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes logoIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.splash .word{font-family:var(--display);font-size:32px;font-weight:600;letter-spacing:.55em;padding-left:.55em;opacity:0;animation:wordIn .9s .9s var(--ease) forwards}
@keyframes wordIn{from{opacity:0;letter-spacing:1.1em}to{opacity:1;letter-spacing:.55em}}
.splash .line{width:0;height:1px;background:#C8AB7A;animation:lineGrow .8s 1s var(--ease) forwards}
@keyframes lineGrow{to{width:120px}}
.splash .hello{font-family:var(--display);font-style:italic;font-size:22px;color:#cdbf9f;opacity:0;animation:fadeUp .7s 1.25s var(--ease) forwards;text-align:center}
.hello-sub{display:block;font-style:normal;font-family:var(--ui);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(239,235,225,.7);margin-top:10px;opacity:0;animation:fadeUp .7s 1.6s var(--ease) forwards}
.splash.gate .d,.splash.gate .br,.splash.gate .sp-logo,.splash.gate .word,.splash.gate .hello,.splash.gate .hello-sub,.splash.gate .line{animation-play-state:paused}
.sp-gate{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;cursor:pointer;background:inherit;transition:opacity .35s var(--ease);-webkit-tap-highlight-color:transparent}
.splash:not(.gate) .sp-gate{opacity:0;pointer-events:none}
.sp-ring{width:110px;height:110px;border-radius:50%;border:1px solid rgba(200,171,122,.6);display:grid;place-items:center;animation:gateBreath 2.6s ease-in-out infinite}
.sp-ring img{width:62px;height:62px;object-fit:contain}
.sp-gate-t{font-family:var(--display);font-style:italic;font-size:21px;letter-spacing:.16em;color:#cdbf9f;animation:gatePulse 2.6s ease-in-out infinite}
@keyframes gateBreath{0%,100%{opacity:.5;transform:scale(1);box-shadow:0 0 0 0 rgba(200,171,122,.0)}50%{opacity:1;transform:scale(1.06);box-shadow:0 0 0 14px rgba(200,171,122,.08)}}
@keyframes gatePulse{0%,100%{opacity:.45}50%{opacity:1}}

/* avatari */
.av{width:26px;height:26px;flex:none;border-radius:50%;display:inline-grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--gold);color:var(--green)}
.av.av-k{background:#16302A;color:#EFEBE1;box-shadow:0 0 0 1.5px var(--gold)}.av.av-c{background:#E9D3C4;color:#7a3b2b}.av.av-o{background:var(--surface-2);color:var(--ink-2)}.av.sys{background:var(--gold-wash);font-size:14px}

/* zvonce */
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:transparent;color:#F4EFE6;display:grid;place-items:center;flex:none;transition:background .2s}
.bell:hover{background:rgba(255,255,255,.08)}
.bell-n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#C0503A;color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;animation:pop .4s var(--ease);box-shadow:0 0 0 2px var(--green)}
.bell-n.hidden{display:none}
.bell-menu{position:absolute;top:56px;right:14px;width:min(380px,calc(100vw - 20px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px -18px rgba(15,34,25,.5);z-index:80;display:none;overflow:hidden}
.bell-menu.open{display:block;animation:modalIn2 .3s var(--ease)}
@keyframes modalIn2{from{opacity:0;transform:translateY(-8px) scale(.98)}}
.bm-h,.bm-f{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bm-f{border-top:1px solid var(--line);border-bottom:0;flex-wrap:wrap}
.bm-h b{font-family:var(--display);font-size:20px;font-weight:600}
.bm-list{max-height:60vh;overflow:auto}
.bm-i{display:flex;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 14px;align-items:flex-start}
.bm-i:hover{background:var(--surface-2)}
.bm-i.new{background:var(--gold-wash)}
.bm-i b{display:block;font-size:13.5px}.bm-i small{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.35}.bm-i em{display:block;font-style:normal;color:var(--muted);font-size:11px;margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.bm-ic{width:30px;height:30px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.bm-i.k-urgent .bm-ic,.bm-i.k-deadline .bm-ic{background:#F6DCD5}

/* kartice obaveštenja */
.ntray{position:fixed;bottom:18px;right:18px;z-index:95;display:flex;flex-direction:column;gap:10px;width:360px;max-width:calc(100vw - 24px);pointer-events:none}
.ncard{pointer-events:auto;cursor:pointer;position:relative;display:flex;gap:11px;align-items:flex-start;background:rgba(250,248,242,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:12px 38px 12px 12px;box-shadow:0 18px 40px -16px rgba(15,34,25,.45);animation:nIn .5s var(--ease) both;transition:transform .3s var(--ease),opacity .3s}
.ncard .av{width:34px;height:34px;border-radius:11px;transform:rotate(-4deg);font-size:16px}
.ncard.out{transform:translateX(40px) scale(.96);opacity:0}
.ncard.alarm{background:#2a120c;color:#fbeee8;border-color:#7a2a1a;animation:nIn .5s var(--ease) both,alarmShake .5s .5s 2}
.ncard.alarm .n-s,.ncard.alarm .n-w{color:#f0c9bd}
.ncard.lead{box-shadow:0 0 0 2px rgba(200,171,122,.6),0 18px 40px -16px rgba(15,34,25,.45)}
@keyframes nIn{from{opacity:0;transform:translateX(30px) scale(.97)}to{opacity:1;transform:none}}
@keyframes alarmShake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.n-body{flex:1;min-width:0;font-size:12.5px;line-height:1.35}.n-t{font-weight:700;font-size:13.5px}.n-s{color:var(--ink-2);overflow-wrap:anywhere}.n-w{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;font-weight:700}
.n-x{position:absolute;top:8px;right:8px;border:0;background:transparent;color:inherit;opacity:.5;font-size:13px}

/* iskačuća kartica zadatka */
.tpop{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:120;width:min(440px,calc(100vw - 24px));display:flex;align-items:flex-start;gap:12px;padding:14px 12px 16px 14px;border-radius:18px;background:#0F2219;color:#EFEBE1;box-shadow:0 22px 50px -14px rgba(5,12,8,.6),0 0 0 1px rgba(239,235,225,.08);transform:translate(-50%,130%) scale(.92);opacity:0;pointer-events:none;transition:transform .5s cubic-bezier(.2,1.35,.35,1),opacity .25s ease;overflow:hidden;cursor:pointer}
.tpop.in{transform:translate(-50%,0) scale(1);opacity:1;pointer-events:auto}
.tpop.done{background:linear-gradient(135deg,#1f3a26,#0F2219)}
.tp-ic{position:relative;flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center}.tp-ic svg{position:relative;z-index:1}
.tp-c{fill:#C8AB7A;transform-origin:center;transform:scale(.2);opacity:0}.tpop.done .tp-c{fill:#5e9e5a}
.tp-k{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
.tpop.in .tp-c{animation:tpPop .45s .08s cubic-bezier(.2,1.6,.4,1) forwards}.tpop.in .tp-k{animation:tpDraw .38s .32s ease-out forwards}
.tp-burst{position:absolute;left:50%;top:50%;width:0;height:0}
.tp-burst i{position:absolute;left:-3px;top:-3px;width:6px;height:6px;border-radius:50%;background:#E3CFA3;opacity:0}
.tp-burst i:nth-child(3n){background:#EFEBE1;width:4px;height:4px}.tp-burst i:nth-child(4n){background:#9cc28f}
.tpop.in .tp-burst i{animation:tpBurst .7s calc(.18s + var(--d)) cubic-bezier(.15,.7,.3,1) forwards}
.tp-body{min-width:0;flex:1}
.tp-h{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#E3CFA3}.tpop.done .tp-h{color:#b5dcae}
.tp-t{font-family:var(--display);font-size:21px;font-weight:600;line-height:1.2;margin-top:3px;overflow-wrap:anywhere;opacity:0;transform:translateY(6px)}
.tpop.in .tp-t{animation:tpUp .4s .22s ease forwards}
.tp-m{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;opacity:0}.tpop.in .tp-m{animation:tpUp .4s .32s ease forwards}
.tp-m .tk-due{background:rgba(239,235,225,.12);color:#EFEBE1}
.tpop .tp-av{width:22px;height:22px;font-size:11px;transform:scale(0);box-shadow:0 0 0 2px #0F2219,0 0 0 3.5px rgba(239,235,225,.55)}
.tpop.in .tp-av{animation:tpAv .35s calc(.42s + var(--i) * 80ms) cubic-bezier(.2,1.6,.4,1) forwards}
.tp-who{font-size:12px;color:#d2d6c9}
.tp-side{display:flex;flex-direction:column;gap:6px;flex:none}
.tp-btn{width:30px;height:30px;border-radius:9px;border:0;background:rgba(239,235,225,.08);color:#EFEBE1;font-size:13px}
.tp-bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:#C8AB7A;transform-origin:left;transform:scaleX(0)}.tpop.done .tp-bar{background:#5e9e5a}
.tpop.in .tp-bar{animation:tpBar 5.2s linear forwards}
@keyframes tpPop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes tpDraw{to{stroke-dashoffset:0}}
@keyframes tpBurst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@keyframes tpUp{to{opacity:1;transform:none}}
@keyframes tpAv{to{transform:scale(1)}}
@keyframes tpBar{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* proslava */
.cele{position:fixed;inset:0;z-index:420;pointer-events:none;display:flex;align-items:center;justify-content:center}
.cele.in{pointer-events:auto}
.cele-card{position:relative;background:radial-gradient(420px 240px at 50% 0%,#1d3a2d,#0F2219);color:#EFEBE1;border:1px solid rgba(200,171,122,.5);border-radius:22px;padding:24px 32px 22px;text-align:center;box-shadow:0 30px 80px -20px rgba(0,0,0,.55);transform:scale(.6) translateY(24px);opacity:0;transition:transform .55s cubic-bezier(.2,1.4,.4,1),opacity .3s;max-width:min(380px,calc(100vw - 40px))}
.cele.in .cele-card{transform:none;opacity:1}
.cele-ic{width:56px;height:56px;object-fit:contain;display:inline-block}
.cele.in .cele-ic{animation:celeSpin 1.1s cubic-bezier(.2,1.3,.4,1)}
.cele-t{font-family:var(--display);font-size:32px;font-weight:600;line-height:1.1;margin-top:6px}
.cele-s{font-size:13.5px;color:#cdbf9f;margin-top:6px}
.cele-bits{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cele-bits i{position:absolute;top:-16px;opacity:0}
.cele.in .cele-bits i{animation:celeFall var(--dur) var(--del) cubic-bezier(.25,.6,.4,1) forwards}
@keyframes celeFall{0%{opacity:1;transform:translate(0,0) rotate(0)}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx),105vh) rotate(var(--r))}}
@keyframes celeSpin{from{transform:rotate(-200deg) scale(.2)}to{transform:none}}

/* zadaci */
.tk-quick{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tk-quick input{flex:1;min-width:220px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;outline:none;transition:border-color .2s,box-shadow .2s}
.tk-quick input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,171,122,.18)}
.tk-quick select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;font-size:14px}
.tk-bar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tk-bar .seg button.on{background:var(--green);color:#F4EFE6}
.tk-people{display:flex;gap:6px;flex-wrap:wrap}
.tk-people button{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;transition:border-color .2s,background .2s}
.tk-people button.on{border-color:var(--green);background:var(--wash)}
.tk-people b{color:var(--muted);font-weight:600}
.tk-group{margin-bottom:14px}
.tk{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s,opacity .3s,transform .4s var(--ease)}
.tk:last-child{border-bottom:0}
.tk:hover{background:linear-gradient(90deg,transparent,var(--surface-2) 12%,var(--surface-2) 88%,transparent)}
.tk-t{font-weight:600;font-size:14.5px;line-height:1.3}
.tk.is-done .tk-t{text-decoration:line-through;color:var(--muted)}
.tk-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.tk-due,.tk-pr,.tk-c{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.tk-due.late{background:var(--clay-wash);color:#9b3b2a}.tk-due.today{background:var(--ochre-wash);color:var(--ochre)}
.tk-pr.hitno{background:#C0503A;color:#fff;animation:prioPulse 1.8s infinite}.tk-pr.visok{background:var(--gold-wash);color:var(--gold-ink)}
@keyframes prioPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,80,58,.5)}50%{box-shadow:0 0 0 5px rgba(192,80,58,0)}}
.tk.urgent{box-shadow:inset 3px 0 0 #C0503A;padding-left:10px}
.tk-check{flex:none;width:28px;height:28px;border:0;background:transparent;padding:0;display:grid;place-items:center}
.tk-check svg{width:26px;height:26px}
.tk-check circle{fill:transparent;stroke:var(--line);stroke-width:1.8;transition:fill .25s,stroke .25s}
.tk-check path{fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;stroke-dashoffset:16;transition:stroke-dashoffset .3s .1s}
.tk-check:hover circle{stroke:var(--sage)}
.tk.is-done .tk-check circle,.tk.finishing .tk-check circle{fill:#5e9e5a;stroke:#5e9e5a}
.tk.is-done .tk-check path,.tk.finishing .tk-check path{stroke-dashoffset:0}
.tk.finishing{opacity:.35;transform:translateX(18px)}
.tk.finishing .tk-check{animation:pop .4s var(--ease)}
.empty.big{padding:48px 10px;font-size:15px}
.empty-ic{width:54px;height:54px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--wash);color:#3f6b44;font-size:24px;animation:pop .6s var(--ease)}
@media (max-width:700px){.ntray{left:12px;right:12px;bottom:14px;width:auto}.bell-menu{right:8px}.tk-quick select{flex:1;height:42px}}
@media (prefers-reduced-motion:reduce){.tpop{transition:opacity .2s}.tp-burst,.cele-bits{display:none}}

@media (prefers-reduced-motion:reduce){*{transition:none !important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>


<!-- UVOD -->
<div class="splash hidden" id="splash">
  <div class="sp-stage">
    <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="d" cx="60" cy="60" r="54"/><circle class="d d2" cx="60" cy="60" r="46"/><path class="br" d="M30 92h60"/></svg>
    <img class="sp-logo" src="mono.webp" alt="">
  </div>
  <div class="word">EQUIVRA</div>
  <div class="line"></div>
  <div class="hello"></div>
  <div class="sp-gate"><div class="sp-ring"><img src="mono.webp" alt=""></div><div class="sp-gate-t">Dodirni za ulazak</div></div>
</div>

<!-- LOGIN -->
<section id="login" class="login hidden">
  <form class="login-card" id="loginForm" autocomplete="on">
    <img class="mono" src="mono.webp" alt="" style="filter:none">
    <h1>EQUIVRA</h1>
    <p>CRM · aukcijska kuća</p>
    <div class="field"><label for="lu">Korisničko ime</label><input id="lu" autocomplete="username" required></div>
    <div class="field"><label for="lp">Lozinka</label><input id="lp" type="password" autocomplete="current-password" required></div>
    <button class="btn" style="width:100%;margin-top:6px" type="submit">Prijavi se</button>
    <div class="err" id="lerr"></div>
  </form>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header class="topbar">
    <img class="mono" src="mono.webp" alt="">
    <div class="brand"><b>EQUIVRA</b><span>CRM · aukcije konja</span></div>
    <label class="search">
      <input id="q" type="search" placeholder="Traži kontakt, konja, telefon" autocomplete="off">
      <div id="sres" class="sresults hidden"></div>
    </label>
    <button class="bell" id="bell" title="Obaveštenja" aria-label="Obaveštenja"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span id="bellN" class="bell-n hidden">0</span></button>
    <div class="bell-menu" id="bellMenu"></div>
    <button class="chip-user" id="userChip" title="Odjava"><i id="uInit" class="av">?</i><span id="uName"></span></button>
  </header>
  <nav class="nav" id="nav">
    <button data-v="danas" aria-current="page">Danas</button>
    <button data-v="zadaci">Zadaci<span class="badge hidden">0</span></button>
    <button data-v="kontakti">Kontakti</button>
    <button data-v="pipeline">Pipeline</button>
    <button data-v="konji">Konji</button>
    <button data-v="marketing">Marketing</button>
    <button data-v="kalendar">Kalendar</button>
    <button data-v="istorija">Istorija</button>
    <button data-v="podesavanja">Podešavanja</button>
  </nav>
  <main class="wrap" id="main"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="dr-head"><button class="x" data-close aria-label="Zatvori">✕</button><span class="pname" id="drTitle"></span><div class="psub" id="drSub"></div></div>
  <div class="dr-body" id="drBody"></div>
</aside>
<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="m-h"><span id="mTitle"></span><button class="x" data-close aria-label="Zatvori">✕</button></div>
  <div class="m-b" id="mBody"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js?v=202611251130"></script>
<script src="fx.js?v=202611251130"></script>
<script src="app.js?v=202611251130"></script>
</body>
